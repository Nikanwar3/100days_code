name: Daily DSA Commit

on:
  schedule:
    # 03:30 UTC ≈ 09:00 IST, every day
    - cron: '30 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-dsa
  cancel-in-progress: false

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic

      - name: Generate today's DSA problem + solution
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_daily_solution.py

      - name: Commit and push
        run: |
          git config user.name "100 Days Bot"
          git config user.email "actions@users.noreply.github.com"
          git add daily README.md
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Day ${{ steps.gen.outputs.day }}: ${{ steps.gen.outputs.title }}"
            git push
          fi
